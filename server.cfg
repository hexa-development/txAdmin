## ─────────────────────────────────────────────────────────────
##  Hexa Framework — RedM server configuration
##  Deployed by the hexacore txAdmin recipe
##  https://github.com/hexa-development/txAdmin
##
##  Docs: https://hexa-development.github.io/hexa-docs/
##  ภาษาไทย: https://hexa-development.github.io/hexa-docs/th/
## ─────────────────────────────────────────────────────────────

## ── Endpoints and slots ──────────────────────────────────────
{{serverEndpoints}}
sv_maxclients {{maxClients}}

## ── RedM ─────────────────────────────────────────────────────
## Required. Without `gamename rdr3` the server boots as FiveM
## and no rdr3 resource will start.
set gamename rdr3
set sv_enforceGameBuild 1491

## ── License key ──────────────────────────────────────────────
sv_licenseKey "{{svLicense}}"

## ── Database ─────────────────────────────────────────────────
## hexa_core creates and migrates its own tables from install.sql
## on every boot, so there is nothing to import by hand.
set mysql_connection_string "{{dbConnectionString}}"
set mysql_slow_query_warning 300

## ── Locale ───────────────────────────────────────────────────
## Both accept 'en' or 'th'.
setr locale "en"
setr hexa_inventory:locale "en"

## ── Server identity ──────────────────────────────────────────
sv_hostname "{{serverName}}"
sets sv_projectName "{{serverName}}"
sets sv_projectDesc "{{recipeDescription}}"
sets locale "en-US"
load_server_icon myLogo.png
sets Framework "Hexa"
sets tags "redm, roleplay, hexa"

## ── Base resources ───────────────────────────────────────────
## sessionmanager-rdr3 ships with the server artifact.
## mapmanager and spawnmanager come from cfx-server-data —
## hexa_core falls back to spawnmanager if RedM has not created
## the ped within ten seconds.
ensure sessionmanager-rdr3
ensure mapmanager
ensure spawnmanager

## FiveM-only, downloaded but must stay off on RedM:
#ensure basic-gamemode
#ensure hardcap

## ── Database driver ──────────────────────────────────────────
## Must start before hexa_core.
ensure oxmysql

## ── Hexa Framework ───────────────────────────────────────────
## Order matters: core, then the resources that build on it.
ensure hexa_core
ensure hexa_progbar
ensure hexa_inventory

## ── Compatibility bridges ────────────────────────────────────
## Opt in only, and start them after hexa_core.
## Never run a bridge together with the real framework core of
## the same name — the resource names match on purpose.
## https://github.com/hexa-development/hexa-bridge
#ensure rsg-core
#ensure vorp_core

## ── Permissions ──────────────────────────────────────────────
## hexa_core registers the aces hexacore.admin and hexacore.staff
## and grants each command to them as it is registered.
add_ace group.admin command allow
add_ace hexacore.admin command allow
add_principal hexacore.admin hexacore.staff

## Grant yourself admin: copy your license identifier from
## txAdmin → Players, then uncomment both lines.
#add_principal identifier.license:0000000000000000000000000000000000000000 hexacore.admin
#add_principal identifier.license:0000000000000000000000000000000000000000 group.admin

## ── txAdmin ──────────────────────────────────────────────────
set txAdmin-menuPtfxDisable true
